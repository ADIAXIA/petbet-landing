<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout canceled — PetBet</title>
<meta name="description" content="Your PetBet Premium checkout was canceled.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, #fff8ef 0%, #ffe9d6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  }
  .paw {
    font-size: 48px;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    color: #1a1a1a;
    margin-bottom: 12px;
  }
  p {
    color: #555;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    background: #0074d4;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 16px;
    transition: transform 0.15s ease;
  }
  .btn:active {
    transform: scale(0.97);
  }
  .footnote {
    margin-top: 24px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="paw">🐾</div>
    <h1>No worries!</h1>
    <p>Your checkout was canceled and you haven't been charged. You can try again anytime from the app.</p>
    <a href="petbet://" class="btn">Back to PetBet</a>
    <p class="footnote">You can safely close this tab and return to the app.</p>
  </div>
</body>
</html>
